name: saas-delivery

x-php: &php
  build: docker/php
  image: saas-delivery-php:dev
  # Mesmo usuário do php-fpm: arquivos criados por artisan/composer/testes continuam graváveis pela web.
  user: www-data
  environment:
    COMPOSER_HOME: /tmp/composer
  volumes:
    - ./:/var/www/html
    # vendor/ fica num volume: ler milhares de arquivos por bind mount no Windows é muito lento.
    - vendor:/var/www/html/vendor
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  app:
    <<: *php

  queue:
    <<: *php
    command: php artisan queue:work redis --tries=3 --sleep=1
    restart: unless-stopped

  scheduler:
    <<: *php
    command: php artisan schedule:work
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      APP_DB_USER: ${DB_USERNAME:-saas}
      APP_DB_PASSWORD: ${DB_PASSWORD:-secret}
      APP_DB_NAME: ${DB_DATABASE:-saas}
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${FORWARD_MAILPIT_UI_PORT:-8025}:8025"

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules

volumes:
  pgdata:
  redisdata:
  vendor:
  node_modules:
