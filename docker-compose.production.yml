# Produção (um servidor). Uso:
#   cp .env.production.example .env   (e preencha)
#   docker compose -f docker-compose.production.yml up -d --build
# Passo a passo completo em docs/PRODUCAO.md.
name: saas-delivery

x-app: &app
  build:
    context: .
    dockerfile: docker/production/Dockerfile
    target: app
  image: saas-delivery-app:latest
  env_file: .env
  restart: unless-stopped
  volumes:
    # Fotos, logos, backups locais e logs sobrevivem a novos deploys.
    - storage:/var/www/html/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      retries: 10

  queue:
    <<: *app
    # Reinicia sozinho a cada hora (libera memória) e quando cai.
    command: php artisan queue:work redis --tries=3 --max-time=3600 --sleep=1
    stop_grace_period: 60s

  scheduler:
    <<: *app
    command: php artisan schedule:work

  web:
    build:
      context: .
      dockerfile: docker/production/Dockerfile
      target: web
    image: saas-delivery-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      CADDY_ASK_TOKEN: ${CADDY_ASK_TOKEN}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      APP_DB_USER: ${DB_USERNAME}
      APP_DB_PASSWORD: ${DB_PASSWORD}
      APP_DB_NAME: ${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    # Sem porta exposta: só os containers acessam o banco.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

volumes:
  storage:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
